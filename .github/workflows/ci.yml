name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # The plugin declares an interface range (>=0.2.1-rc.2 <0.2.2-0), not a DSH
  # revision. The native job runs one checkout per verified release tag below.
  DSH_TELEMETRY_DISABLED: '1'
jobs:
  pairing:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: pin
        shell: python
        run: |
          import json, os
          from pathlib import Path
          value = json.loads(Path('core.lock.json').read_bytes())['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + value + '\n')
  bridge:
    needs: pairing
    name: bridge ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Iris0fTheValley/Thaliris
          path: shared-core
          ref: ${{ needs.pairing.outputs.commit }}
      - name: Selected Core identity
        run: 'git -C shared-core show -s --format="Core commit: %H%nSubject: %s" HEAD'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8.0'
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      # The whole directory: a new test file runs without a workflow edit.
      - name: Core lock and bridge suites
        run: python -m pytest tests --junitxml=results/bridge.xml
        env:
          THALIRIS_CORE_PATH: ${{ github.workspace }}/shared-core/src
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bridge-results-${{ matrix.os }}-python-${{ matrix.python }}
          path: results/*.xml
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prompt contracts
        run: node tests/prompt-contract.mjs
      # Keyless: these modules must parse without a DSH checkout. The contract
      # assertions for the package exports, the preset declaration and the
      # committed composition mirror already live in prompt-contract.mjs.
      - name: Preset, package and setup modules parse
        if: ${{ !cancelled() }}
        run: >-
          node --check index.mjs preset.mjs composition.mjs setup.mjs
          build-composition.mjs build-bundle.mjs policy.mjs role-templates.mjs
          tests/composition-drift.mjs
      - name: Generated bundle drift
        if: ${{ !cancelled() }}
        run: |
          node build-bundle.mjs
          git diff --exit-code cordis.patch.yml
  dsh-native:
    needs: pairing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One verified interface-compatible release per row, selected by tag so
        # the gate never depends on a committed revision hash.
        dsh-tag: [dsh-v0.2.1-rc.2, dsh-v0.2.1-rc.3]
    name: native ${{ matrix.dsh-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: adapter
      - uses: actions/checkout@v4
        with:
          repository: Iris0fTheValley/Thaliris
          path: shared-core
          ref: ${{ needs.pairing.outputs.commit }}
      # A checkout of one verified release; the plugin admits any 0.2.1 source
      # inside its engines.dsh range, so the tag is evidence rather than a pin.
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: dsh-src
          ref: ${{ matrix.dsh-tag }}
          persist-credentials: false
      - name: Selected DSH identity
        run: 'git -C dsh-src show -s --format="DSH commit: %H%nSubject: %s" HEAD'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dsh-src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DSH dependencies
        working-directory: dsh-src
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The linux-x64 system addon (flock) is not shipped in the source tree;
      # build it exactly as the checked-out DSH tree defines (host addon only).
      - name: Build DSH host system addon
        working-directory: dsh-src
        run: pnpm build:native-system
      # The programmatic Agent Preset must carry DSH's Standard composition;
      # this gate fails loudly when the host preset changed without a regenerated
      # composition.mjs (run per verified tag, so rc.2 and rc.3 are both checked).
      - name: Composition mirror drift gate
        working-directory: adapter
        run: node tests/composition-drift.mjs
        env:
          DSH_SOURCE: ${{ github.workspace }}/dsh-src
      # The committed mirror records the rc.3 provenance line; regenerating from
      # that tag must be byte-identical. Older/admitted tags are covered by the
      # row-level drift gate above instead.
      - name: Composition mirror regeneration is committed
        if: ${{ !cancelled() && matrix.dsh-tag == 'dsh-v0.2.1-rc.3' }}
        working-directory: adapter
        run: |
          node build-composition.mjs
          git diff --exit-code composition.mjs
        env:
          DSH_SOURCE: ${{ github.workspace }}/dsh-src
      - name: Native composition (scripted model)
        working-directory: adapter
        run: npm run test:native
        env:
          DSH_SOURCE: ${{ github.workspace }}/dsh-src
          THALIRIS_CORE_PATH: ${{ github.workspace }}/shared-core/src
          THALIRIS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Shared client components
        if: ${{ !cancelled() }}
        working-directory: adapter
        run: npm run test:client
        env:
          DSH_SOURCE: ${{ github.workspace }}/dsh-src
      - name: Isolated Core wheel and local archives
        if: ${{ !cancelled() }}
        id: pack
        run: |
          # Ordinary (symlinked) venv, as users create it; the smoke asserts the symlink.
          python -m venv "$RUNNER_TEMP/core-venv"
          "$RUNNER_TEMP/core-venv/bin/python" -m pip install ./shared-core
          echo "core=$("$RUNNER_TEMP/core-venv/bin/python" -I -c 'import pathlib, thaliris; print(pathlib.Path(thaliris.__file__).parent)')" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/smoke"
          (cd adapter && npm pack --pack-destination "$RUNNER_TEMP/pack")
          (cd adapter/components/memory && npm pack --pack-destination "$RUNNER_TEMP/pack")
          (cd adapter/components/memory-local && npm pack --pack-destination "$RUNNER_TEMP/pack")
      - name: Packed activation smoke
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        working-directory: adapter
        run: npm run test:install
        env:
          DSH_SOURCE: ${{ github.workspace }}/dsh-src
          THALIRIS_PACK_DIR: ${{ runner.temp }}/pack
          THALIRIS_TEST_TMP_ROOT: ${{ runner.temp }}/smoke
          THALIRIS_TEST_PYTHON: ${{ runner.temp }}/core-venv/bin/python
          THALIRIS_TEST_CORE_PATH: ${{ steps.pack.outputs.core }}
